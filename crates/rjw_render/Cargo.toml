[package]
name = "rjw_render"
version = "0.3.0"
edition = "2024"
authors = ["KrisuRJW <Cmd1loica99@163.com>"]
description = "Low-level wgpu render context: surface/device/queue management, textures, static meshes and per-context registries."
license = "MIT"
repository = "https://github.com/parseek/krisu_engine"
readme = "README.md"
keywords = ["wgpu", "render", "graphics", "texture"]
categories = ["game-engines", "graphics"]

[dependencies]
wgpu = "30.0.0"
winit = "0.30.13"
pollster = "0.4"
log = "0.4.33"
thiserror = "2"
bytemuck = { version = "1.25.2", features = ["derive"] }
rjw_typed_registry = { path = "../rjw_typed_registry" }
rjw_color = { path = "../rjw_color", version = "0.3.0", features = ["wgpu"] }
