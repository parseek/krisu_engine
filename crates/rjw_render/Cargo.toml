[package]
name = "rjw_render"
version = "0.1.0"
edition = "2024"
authors = ["KrisuRJW <Cmd1loica99@163.com>"]
description = "Low-level wgpu render context: surface/device/queue management, textures, static meshes and global registries."
license = "MIT"
repository = "https://github.com/parseek/krisu_engine"
readme = "README.md"
keywords = ["wgpu", "render", "graphics", "texture"]
categories = ["game-engines", "graphics"]

[dependencies]
wgpu = "30.0.0"
winit = "0.30.13"
pollster = "0.4"
log = "0.4.33"
dashmap = "6.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
