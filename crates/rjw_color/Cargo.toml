[package]
name = "rjw_color"
version = "0.1.0"
edition = "2024"

authors = ["KrisuRJW <Cmd1loica99@163.com>"]
description = "A color manipulation library with optional glam, serde, and wgpu integrations."
license = "MIT"   
repository = "https://github.com/parseek/krisu_engine"
readme = "README.md"

keywords = ["color", "rgba", "graphics"]
categories = ["multimedia::images"]

[dependencies]
glam = { version = "0.33.2", features = ["serde"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
wgpu = { version = "30.0.0", optional = true }

[features]
glam = ["dep:glam"]
serde = ["dep:serde", "glam?/serde"]
wgpu = ["dep:wgpu"]