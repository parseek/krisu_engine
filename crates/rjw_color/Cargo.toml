[package]
name = "rjw_color"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.33.2", features = ["serde"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
wgpu = { version = "30.0.0", optional = true }

[features]
glam = ["dep:glam"]
serde = ["dep:serde", "glam?/serde"]
wgpu = ["dep:wgpu"]