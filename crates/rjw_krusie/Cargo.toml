[package]
name = "rjw_krusie"
version = "0.2.0"
edition = "2024"
authors = ["KrisuRJW <Cmd1loica99@163.com>"]
description = "Unified entry point for the krusie engine: one-line prelude plus per-crate namespaces."
license = "MIT"
repository = "https://github.com/parseek/krisu_engine"
readme = "README.md"
keywords = ["engine", "prelude", "facade", "gamedev", "2d"]
categories = ["game-engines", "game-development"]

[dependencies]
rjw_main = { path = "../rjw_main", version = "0.1.1" }
rjw_render = { path = "../rjw_render", version = "0.1.0" }
rjw_2d_render = { path = "../rjw_2d_render", version = "0.2.0" }
rjw_transform = { path = "../rjw_transform", version = "0.1.3" }
rjw_color = { version = "0.1.0", features = ["wgpu"] }
rjw_atlas = { path = "../rjw_atlas", version = "0.1.3", optional = true }
rjw_text = { path = "../rjw_text", version = "0.2.2", optional = true }
rjw_ui = { path = "../rjw_ui", version = "0.1.8", optional = true }
rjw_tilemap = { path = "../rjw_tilemap", version = "0.1.0", optional = true }
rjw_collision = { path = "../rjw_collision", version = "0.1.0", optional = true }

[features]
# 默认装齐「整套库」；只要 2D 绘制时可 `default-features = false`。
default = ["atlas", "text", "ui", "tilemap", "collision"]
atlas = ["dep:rjw_atlas"]
text = ["dep:rjw_text"]
ui = ["dep:rjw_ui"]
tilemap = ["dep:rjw_tilemap"]
collision = ["dep:rjw_collision"]
