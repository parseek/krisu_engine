[package]
name = "rjw_atlas"
version = "0.3.0"
edition = "2024"
authors = ["KrisuRJW <Cmd1loica99@163.com>"]
description = "Runtime dynamic (Guillotine free-rect) and static texture atlases with lifetime management and TOML import/export."
license = "MIT"
repository = "https://github.com/parseek/krisu_engine"
readme = "README.md"
keywords = ["atlas", "sprite", "texture", "guillotine"]
categories = ["game-development", "multimedia::images"]

[dependencies]
rjw_render = { path = "../rjw_render", version = "0.3.0" }
glam = "0.33.2"
wgpu = "30.0.0"
log = "0.4.33"
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

[features]
default = ["serde", "toml"]
serde = ["dep:serde", "dep:toml"]
# TOML 批量导入 / 导出（`DynamicAtlas::load_toml` / `export_toml`、`StaticAtlas::from_toml` / `to_toml`）。
toml = ["dep:toml", "dep:serde"]
