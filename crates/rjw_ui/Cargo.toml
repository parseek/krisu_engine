[package]
name = "rjw_ui"
version = "0.3.0"
edition = "2024"
authors = ["KrisuRJW <Cmd1loica99@163.com>"]
description = "Immediate-mode style UI with persistent state, DOM-like auto layout (pack/grid/place) for the krusie engine."
license = "MIT"
repository = "https://github.com/parseek/krisu_engine"
readme = "README.md"
keywords = ["ui", "gui", "widget", "immediate-mode", "game-development"]
categories = ["game-development", "gui"]

[dependencies]
rjw_atlas = { path = "../rjw_atlas", version = "0.3.0" }
rjw_2d_render = { path = "../rjw_2d_render", version = "0.3.0" }
rjw_render = { path = "../rjw_render", version = "0.3.0" }
rjw_text = { path = "../rjw_text", version = "0.3.0" }
rjw_transform = { path = "../rjw_transform", version = "0.3.0" }
rjw_color = { path = "../rjw_color", version = "0.3.0" }
rjw_mouse = { path = "../rjw_mouse", version = "0.3.0" }
rjw_keyboard = { path = "../rjw_keyboard", version = "0.3.0" }
rjw_keystate = { path = "../rjw_keystate", version = "0.3.0" }
glam = "0.33.2"
winit = "0.30.13"
# 剪贴板（文本选择复制/粘贴/剪切；跨平台：Windows / macOS / Linux / Web）。
arboard = "3"